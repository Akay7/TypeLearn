# Local development database. Start with:
#   podman network create typelearn-net
#   podman-compose up -d
# Credentials live in db.env (git-ignored); copy db.example.env to create it.

services:
  db:
    image: postgres:17
    container_name: typelearn-db
    env_file:
      - db.env
    ports:
      - "5432:5432"
    volumes:
      - typelearn-db-data:/var/lib/postgresql/data
    networks:
      - typelearn-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  typelearn-db-data:

networks:
  typelearn-net:
    external: true
