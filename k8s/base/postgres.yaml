# PostgreSQL, run by the CloudNativePG operator the Tiltfile installs.
#
# One Cluster per worktree namespace, so each checkout has its own database and
# neither can read the other's exercises. Storage is the cluster's default
# StorageClass — kind ships Rancher's local-path-provisioner as `standard`.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 1
  # Pinned to 17 because the project's tech-stack and specs say 17. CNPG's own
  # default is newer; moving is a decision with its own reasons and does not
  # belong to this change.
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: typelearn
      owner: typelearn
  # The "Run backend tests" button runs pytest-django, which creates and drops
  # its own `test_typelearn` database on every run. The bootstrap owner role has
  # no such privilege by default, so grant it here. CNPG reconciles managed
  # roles continuously, so this takes effect on a running cluster too, not only
  # a fresh bootstrap. `passwordSecret` points back at the secret CNPG already
  # generated for this role, so managing the role does not clear its password.
  managed:
    roles:
      - name: typelearn
        ensure: present
        login: true
        createdb: true
        passwordSecret:
          name: postgres-app
  # A development database on one node: no replicas to fail over to, and a
  # restart is cheaper than a resync.
  primaryUpdateStrategy: unsupervised
