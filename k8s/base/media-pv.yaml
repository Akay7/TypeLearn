# The shared audio volume, as this worktree sees it.
#
# Kubernetes will not let two namespaces bind one PersistentVolume — binding is
# one-to-one and exclusive, and ReadWriteMany means many *pods*, not many
# namespaces. So each worktree gets its OWN PV object, and they all point at the
# same node path. The sharing happens below Kubernetes, in the directory.
#
# The name carries the worktree slug because PVs are cluster-scoped, and
# `claimRef` is pre-set so a worktree cannot bind another worktree's PV by
# racing it to the claim.
apiVersion: v1
kind: PersistentVolume
metadata:
  # `media-$(WORKTREE_SLUG)` — the Tiltfile substitutes the slug.
  name: media-WORKTREE_SLUG
spec:
  capacity:
    storage: 8Gi
  accessModes:
    - ReadWriteMany
  # Retain, not Delete: `tilt down` in one worktree must not take the clips away
  # from every other worktree, nor from the host.
  persistentVolumeReclaimPolicy: Retain
  # Empty, not unset: an unset class would send this to the default provisioner
  # and dynamically provision an unshared volume instead of binding this one.
  storageClassName: ""
  hostPath:
    path: /media
  claimRef:
    namespace: WORKTREE_NAMESPACE
    name: media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: media-WORKTREE_SLUG
  resources:
    requests:
      storage: 8Gi
