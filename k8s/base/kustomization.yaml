# The development base, and the base a production overlay builds on.
#
# Two things are deliberately not listed here:
#  - kind.yaml, which configures the cluster rather than anything inside it;
#  - ingest-job.yaml, which is run on demand rather than deployed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - postgres.yaml
  - media-pv.yaml
  - backend.yaml
  - frontend.yaml
  - gateway.yaml
  - httproute.yaml
