# One Gateway per worktree namespace, on the GatewayClass Calico's operator
# provisions when Gateway API support is enabled.
#
# It never reaches Programmed=True on kind: its Envoy Service is a LoadBalancer
# and kind has no controller to assign an address. The data path works anyway —
# the Tiltfile port-forwards the Envoy Service directly — so nothing may wait on
# that condition.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: typelearn-gateway
spec:
  gatewayClassName: tigera-gateway-class
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
