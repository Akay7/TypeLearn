# The Vite dev server, running in the cluster so hot reload survives the move.
# Tilt syncs source into /app; the prod overlay replaces this with the nginx
# image serving the built bundle.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: typelearn-frontend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
          env:
            # Vite's HMR websocket is opened by the browser, which reaches this
            # pod through the Gateway — so the client has to be told the port it
            # actually connects on, not the one the server listens on.
            - name: VITE_HMR_CLIENT_PORT
              # Unquoted on purpose: kustomize re-emits a quoted scalar without
              # its quotes, so the Tiltfile substitutes a quoted value in — an
              # env value must be a string, and a bare number is rejected.
              value: GATEWAY_PORT
          readinessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 5173
