# Drop --reload: the development command exists so Tilt's synced source takes
# effect, and there is no Tilt in production.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  template:
    spec:
      containers:
        - name: backend
          # The lean runtime stage: no test dependencies.
          image: typelearn-backend:runtime
          command:
            - gunicorn
            - typelearn.wsgi:application
            - --bind
            - 0.0.0.0:8000
            - --workers
            - "3"
