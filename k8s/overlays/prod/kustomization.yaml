# The production shape, expressed rather than described.
#
# Nothing deploys this yet — there is no cluster to deploy it to, and no TLS,
# hostname, secret management, or autoscaling here. It exists so the two places
# development deliberately differs from production are visible in the manifests
# instead of living in someone's memory:
#
#   1. the frontend serves a built bundle from nginx, not a dev server;
#   2. the media volume comes from a real StorageClass, not a hostPath.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - path: frontend-serve.yaml
  - path: backend-no-reload.yaml
  # Replace the hostPath PV/PVC pair wholesale: a patch cannot turn a
  # pre-bound static volume into a dynamically provisioned one.
  - path: media-storageclass.yaml
    target:
      kind: PersistentVolumeClaim
      name: media
