# Real storage instead of a directory on the node. The StorageClass name is
# whatever the target cluster provides; `standard` is a placeholder that has to
# be set when there is a cluster to set it for.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: standard
  # No volumeName: production provisions its volume rather than binding a
  # hand-made one.
  volumeName: null
  resources:
    requests:
      storage: 8Gi
