# nginx serving the built bundle — the Containerfile's `serve` stage — instead
# of the Vite dev server the base runs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  template:
    spec:
      containers:
        - name: frontend
          image: typelearn-frontend:serve
          ports:
            - containerPort: 80
          env: []
          readinessProbe:
            httpGet:
              path: /
              port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  ports:
    - port: 80
      targetPort: 80
