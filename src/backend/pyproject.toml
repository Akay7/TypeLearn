[project]
name = "typelearn-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Egor Poderiagin",email = "egor@crazyrussian.pro"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "django (>=6.1,<7.0)",
    "strawberry-graphql-django (>=0.87.0,<0.88.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "gunicorn (>=26.1.0,<27.0.0)",
    "pillow (>=12.3.0,<13.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-django (>=4.14.0,<5.0.0)"
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "typelearn.settings"
python_files = ["test_*.py", "*_test.py"]
