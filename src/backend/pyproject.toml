[project]
name = "typelearn-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Egor Poderiagin",email = "egor@crazyrussian.pro"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "django>=6.1,<7.0",
    "strawberry-graphql-django>=0.87.0,<0.88.0",
    "psycopg[binary]>=3.3.4,<4.0.0",
    "gunicorn>=26.1.0,<27.0.0",
    "pillow>=12.3.0,<13.0.0",
    # Django's own static files — the admin's CSS — are served by the
    # application in every environment. They are a fixed set collected into the
    # image at build time, which is what WhiteNoise is for; the ingested clips
    # are not, and are served by a web server instead. See the chart's media
    # server.
    "whitenoise>=6.12,<7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "pytest-django>=4.14.0,<5.0.0",
    # The debugger is attached to the running container, so it ships in the dev
    # image rather than being installed on a developer's host.
    "debugpy>=1.8,<2.0",
]

# This is a Django application, not a distributable library: there is no
# `typelearn_backend` module to install, so uv must not try. Without this it
# fails with "No file/folder found for package typelearn-backend" when it asks a
# build backend for an editable install. It is also why there is no
# [build-system] here: nothing builds this project, it is only ever synced.
[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "typelearn.settings"
python_files = ["test_*.py", "*_test.py"]
# The container runs as a non-root user that does not own /app, so pytest cannot
# write its cache there and every run prints a PytestCacheWarning. Nothing in
# this project relies on the cache (no --lf/--sw workflow in CI or the Tilt
# button), so turn it off rather than carve out a writable path for it.
addopts = "-p no:cacheprovider"
# Django forces DEBUG=False for tests, so WhiteNoise scans STATIC_ROOT and warns
# once per client instantiation that it is not there. It is not there on a
# developer's machine by design: the collected tree is built into the image by
# `collectstatic` in the Containerfile, and nothing on the host collects it. The
# warning is accurate and says nothing about the code under test, so it is
# silenced here rather than answered by collecting static files to run tests.
filterwarnings = [
    "ignore:No directory at:UserWarning",
]
