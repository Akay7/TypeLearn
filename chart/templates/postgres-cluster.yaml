{{- if .Values.postgres.enabled }}
{{- include "typelearn.requireAPI" (dict "root" $ "api" "postgresql.cnpg.io/v1" "what" "The CloudNativePG operator" "from" "CloudNativePG (helm install cnpg cnpg/cloudnative-pg -n cnpg-system --create-namespace)") }}
# PostgreSQL, run by the CloudNativePG operator — a prerequisite of this chart,
# not part of it.
#
# CNPG generates the application role's credentials into a Secret named
# `postgres-app` and the backend reads five keys out of it. They are in no values
# file and no template, which is the point: a password the chart never sees is a
# password the chart cannot leak into a release.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "typelearn.labels" . | nindent 4 }}
  annotations:
    # `helm uninstall` must not take the data with it. An application that
    # deletes its own database on uninstall is one mistyped command away from an
    # outage; the cost of the opposite mistake is one `kubectl delete cluster`.
    helm.sh/resource-policy: keep
spec:
  instances: {{ .Values.postgres.instances }}
  imageName: {{ .Values.postgres.image }}
  storage:
    size: {{ .Values.postgres.storage.size }}
    {{- with .Values.postgres.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  {{- with .Values.postgres.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  bootstrap:
    initdb:
      database: {{ .Values.postgres.database }}
      owner: {{ .Values.postgres.owner }}
  {{- if .Values.postgres.allowCreateDatabase }}
  # Development only. pytest-django creates and drops its own test database on
  # every run, which the bootstrap owner role cannot do by default. CNPG
  # reconciles managed roles continuously, so this takes effect on a running
  # cluster and not only at bootstrap. `passwordSecret` points back at the Secret
  # CNPG already generated for this role, so managing the role does not clear
  # its password.
  managed:
    roles:
      - name: {{ .Values.postgres.owner }}
        ensure: present
        login: true
        createdb: true
        passwordSecret:
          name: postgres-app
  {{- end }}
  primaryUpdateStrategy: {{ .Values.postgres.primaryUpdateStrategy }}
{{- end }}
