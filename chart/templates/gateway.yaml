{{- if .Values.gateway.enabled }}
{{- include "typelearn.requireAPI" (dict "root" $ "api" "gateway.networking.k8s.io/v1" "what" "A Gateway API implementation" "from" "Calico's, by applying a GatewayAPI resource to the Tigera operator (see k8s/calico-gatewayapi.yaml), or any other implementation providing the GatewayClass named in gateway.className") }}
# The one origin. The SPA, the GraphQL endpoint, and the audio all arrive here,
# which is why the backend carries no CORS configuration at all.
#
# On kind this Gateway never reports Programmed=True — its Envoy Service is a
# LoadBalancer and kind has no controller to assign an address — while the data
# path works regardless. So nothing in this chart, in the Tiltfile, or in CI may
# wait on that condition.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: typelearn-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "typelearn.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      {{- with .Values.gateway.host }}
      # Set, and the listener answers for this name only. Unset, and it answers
      # for every host — which is what development wants and no deployment does.
      hostname: {{ . | quote }}
      {{- end }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- if .Values.gateway.tls.secretName }}
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ required "gateway.tls.secretName needs gateway.host too — a certificate is issued for a name" .Values.gateway.host | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .Values.gateway.tls.secretName }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
{{- end }}
