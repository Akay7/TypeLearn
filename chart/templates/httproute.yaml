{{- if .Values.gateway.enabled }}
# What makes the application one origin, and so what makes CORS unnecessary.
#
# Django's paths go to the backend; everything else falls through to the
# frontend. Gateway API matches more specific paths before the "/" catch-all,
# and the backend rule is listed first regardless.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: typelearn
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "typelearn.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: typelearn-gateway
  {{- with .Values.gateway.host }}
  hostnames:
    - {{ . | quote }}
  {{- end }}
  rules:
    - matches:
        {{- range .Values.gateway.backendPaths }}
        - path:
            type: PathPrefix
            value: {{ . | quote }}
        {{- end }}
      backendRefs:
        - name: backend
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
{{- end }}
