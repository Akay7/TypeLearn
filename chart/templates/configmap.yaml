# The backend's configuration, one key per entry of `.Values.env`.
#
# Nothing here is named by the template: a backend setting is added by adding a
# values entry, never by editing this file. That is the whole point — a setting
# that needs a template change to introduce is a setting someone will introduce
# somewhere else instead.
#
# Secrets do not pass through here. See secret.yaml.
{{- $env := deepCopy .Values.env }}
{{- if .Values.gateway.host }}
  {{/*
    The hostname the Gateway matches has to be one Django accepts, or every
    request through it is a 400 that looks like a routing fault. Appended rather
    than assigned, so an explicit DJANGO_ALLOWED_HOSTS keeps whatever else it
    lists, and skipped when already present so it cannot accumulate duplicates.
  */}}
  {{- $hosts := splitList "," (default "" (get $env "DJANGO_ALLOWED_HOSTS")) }}
  {{- if not (has .Values.gateway.host $hosts) }}
    {{- $_ := set $env "DJANGO_ALLOWED_HOSTS" (append (compact $hosts) .Values.gateway.host | join ",") }}
  {{- end }}
  {{- if eq (toString (get $env "DJANGO_BEHIND_HTTPS_PROXY") | lower) "true" }}
    {{/*
      Secure mode, which is the default: the public origin is https. Django
      cannot always see that for itself — Envoy forwards plain HTTP to it, and
      a TLS-terminating proxy upstream of Envoy may not survive as
      X-Forwarded-Proto — so a browser's `Origin: https://host` is trusted by
      name or every POST, the admin login included, is a 403.

      Appended and de-duplicated like the host above, so an explicit list keeps
      whatever else it names. Skipped in the plain-HTTP mode a local cluster
      opts into: Django derives http://host from the request and agrees.
    */}}
    {{- $origin := printf "https://%s" .Values.gateway.host }}
    {{- $origins := splitList "," (default "" (get $env "CSRF_TRUSTED_ORIGINS")) }}
    {{- if not (has $origin $origins) }}
      {{- $_ := set $env "CSRF_TRUSTED_ORIGINS" (append (compact $origins) $origin | join ",") }}
    {{- end }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "typelearn.labels" . | nindent 4 }}
data:
  {{- range $key, $value := $env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
