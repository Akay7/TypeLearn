# Rendered only when the chart is the one holding the secrets.
#
# `existingSecret` names a Secret the chart neither creates nor copies, which is
# what makes this chart installable with no secret in values at all — values are
# readable by anyone who can read the release, and a cluster with a secrets
# operator wants to own that object itself.
#
# So: an existing Secret named, or no secrets supplied, and this file renders
# nothing whatsoever.
{{- if and (not .Values.existingSecret) .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "typelearn.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
